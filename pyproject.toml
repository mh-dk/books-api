[project]
name = "books-api"
version = "0.1.0"
description = "manage books with RestAPI"
readme = "README.md"
authors = [
    { name = "mh-dk", email = "darvazehkashani@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "psycopg2>=2.9.13",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
books-api = "books_api:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "books_api:app"
